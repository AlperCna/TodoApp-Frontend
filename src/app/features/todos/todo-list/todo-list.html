<div class="todo-container">
  <div class="workspace-header">
    <h1 class="workspace-title">Görevlerim</h1>
    <p class="workspace-desc">Şirketiniz için bugün neler yapacaksınız?</p>
  </div>

  <div class="action-center">
    <div class="modern-search">
      <nz-input-group [nzPrefix]="prefixIconSearch">
        <input type="text" nz-input placeholder="Hızlıca ara..." [(ngModel)]="searchTerm" (input)="onSearch()" />
      </nz-input-group>
      <ng-template #prefixIconSearch><span nz-icon nzType="search" class="search-icon"></span></ng-template>
    </div>

    <div class="creation-box">
      <input nz-input class="main-input" placeholder="Yeni bir görev ekle..." [(ngModel)]="newTodoTitle" (keyup.enter)="addTodo()" />
      
      <div class="creation-footer">
        <div class="input-extras">
          <input nz-input class="desc-input" placeholder="Açıklama (isteğe bağlı)" [(ngModel)]="newTodoDescription" />
          <nz-date-picker class="modern-picker" nzPlaceHolder="Tarih Seç" [(ngModel)]="newTodoDueDate"></nz-date-picker>
        </div>
        <button nz-button nzType="primary" class="modern-add-btn" (click)="addTodo()">
          <span nz-icon nzType="plus"></span> Görev Ekle
        </button>
      </div>
    </div>
  </div>

  <nz-card [nzBordered]="false" class="todo-card list-card">
    <nz-list [nzLoading]="false" class="todo-list-wrapper">
      @for (item of todos; track item.id) {
        <nz-list-item [nzContent]="todoContent" [nzActions]="[deleteAction]">
          <nz-list-item-meta [nzTitle]="todoTitle" [nzDescription]="todoDesc">
            
            <ng-template #todoTitle>
              <div class="title-inline-edit">
                <label nz-checkbox [(ngModel)]="item.isCompleted" (ngModelChange)="updateTodo(item)"></label>
                <input nz-input 
                       class="inline-input" 
                       [(ngModel)]="item.title" 
                       (blur)="updateTodo(item)" 
                       [class.completed-text]="item.isCompleted" />
              </div>
            </ng-template>

            <ng-template #todoDesc>
              <div style="padding-left: 32px;">
                <input nz-input 
                       class="inline-input desc-inline-input" 
                       [(ngModel)]="item.description" 
                       (blur)="updateTodo(item)" 
                       placeholder="Açıklama ekle..." />
              </div>
            </ng-template>

          </nz-list-item-meta>
          
          <ng-template #todoContent>
            @if (item.dueDate) {
              <span class="date-badge" [class.overdue]="!item.isCompleted">
                <span nz-icon nzType="calendar"></span> {{ item.dueDate | date:'dd MMM' }}
              </span>
            }
          </ng-template>
          
          <ng-template #deleteAction>
            <button nz-button nzType="text" nzDanger (click)="delete(item.id)">
              <span nz-icon nzType="delete"></span>
            </button>
          </ng-template>
        </nz-list-item>
      } @empty {
        <nz-empty nzNotFoundImage="simple"></nz-empty>
      }
    </nz-list>

    <div class="modern-footer">
      <span class="count-info"><strong>{{ totalCount }}</strong> toplam görev</span>
      
      <nz-pagination 
        [nzPageIndex]="currentPage" 
        [nzTotal]="totalCount" 
        [nzPageSize]="pageSize" 
        (nzPageIndexChange)="onPageChange($event)" 
        nzSize="small"
        nzHideOnSinglePage>
      </nz-pagination>

      <button nz-button nzType="link" class="modern-logout-btn" (click)="logout()">
        <span nz-icon nzType="logout"></span> Güvenli Çıkış
      </button>
    </div>
  </nz-card>
</div>
