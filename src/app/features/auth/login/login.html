<div class="login-wrapper">
  <nz-card class="login-card" [nzBordered]="false">
    <div class="login-header">
      <div class="login-logo">
        <span nz-icon nzType="lock" nzTheme="twotone" [nzTwotoneColor]="'#d32f2f'"></span>
      </div>
      <h1 class="login-title">Tekrar Hoş Geldin</h1>
      <p class="login-subtitle">Hesabına giriş yap ve görevlerini yönet</p>
    </div>

    <form nz-form [formGroup]="validateForm" (ngSubmit)="onLogin()" nzLayout="vertical">
      
      <nz-form-item>
        <nz-form-label nzRequired>E-posta Adresi</nz-form-label>
        <nz-form-control nzErrorTip="Lütfen geçerli bir e-posta adresi girin!">
          <nz-input-group nzPrefixIcon="mail">
            <input type="email" nz-input formControlName="email" placeholder="ornek@mail.com" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label nzRequired>Şifre</nz-form-label>
        <nz-form-control nzErrorTip="Lütfen şifrenizi girin!">
          <nz-input-group nzPrefixIcon="lock">
            <input type="password" nz-input formControlName="password" placeholder="******" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>

      <button nz-button nzType="primary" nzBlock class="login-btn" [nzLoading]="loading">
        <span nz-icon nzType="login"></span> Giriş Yap
      </button>

      <nz-divider nzText="Veya Kurumsal Giriş"></nz-divider>

      <div style="display: flex; flex-direction: column; gap: 10px;">
        <button type="button" nz-button nzType="default" nzBlock (click)="loginWithSSO('microsoft')">
          <span nz-icon nzType="microsoft"></span> Microsoft ile Giriş Yap
        </button>
        
        <button type="button" nz-button nzType="default" nzBlock (click)="loginWithSSO('google')">
          <span nz-icon nzType="google"></span> Google ile Giriş Yap
        </button>
      </div>
      <div class="login-footer">
        <span>Henüz bir hesabın yok mu?</span><br>
        <a routerLink="/register">Yeni Şirket veya Hesap Oluştur</a>
      </div>
    </form>
  </nz-card>
</div>
